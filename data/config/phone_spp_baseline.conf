# GSDC2022 smartphone conventional SPP baseline
# Keep this file fixed after the baseline is accepted.

pos1-posmode       =single
pos1-frequency     =l1
pos1-soltype       =forward
pos1-elmask        =15
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =off
pos1-tidecorr      =0
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-posopt1       =off
pos1-posopt2       =off
pos1-posopt3       =off
pos1-posopt4       =off
pos1-posopt5       =off
pos1-posopt6       =off
pos1-exclsats      =
pos1-navsys        =9

# Conventional RTKLIB innovation thresholds; phase threshold is irrelevant to SPP.
pos2-rejionno      =5
pos2-rejcode       =30
pos2-niter         =1

out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outvel         =off
out-timesys        =gpst
out-timeform       =hms
out-timendec       =3
out-degform        =deg
out-fieldsep       =
out-outsingle      =on
out-maxsolstd      =0
out-height         =ellipsoidal
out-geoid          =internal
out-solstatic      =all
out-outstat        =off
